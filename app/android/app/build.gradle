apply plugin: 'com.android.application'

android {
    namespace 'com.tradia.cloud'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.tradia.cloud"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/proguard/androidx-*.pro'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
}
